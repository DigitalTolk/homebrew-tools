name: Update lord-of-the-rows cask

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      # `brew style`/`brew audit` are developer commands; opting in up front stops
      # brew from warning that it switched developer mode on by itself.
      - name: Enable Homebrew developer mode
        run: brew developer on

      - name: Update cask from latest Lord of the Rows release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby scripts/update-lord-of-the-rows-cask.rb

      - name: Prepare local tap
        run: scripts/prepare-homebrew-tap.sh

      - name: Lint updated cask
        run: |
          brew style digitaltolk/tools/lord-of-the-rows
          # The app's LSMinimumSystemVersion moves with the Electron it bundles;
          # --fix sets `depends_on macos:` to match it instead of failing.
          brew audit --cask --strict --online --fix digitaltolk/tools/lord-of-the-rows
          # The fix lands in the tap's copy, so bring it back for the PR. When
          # setup-homebrew has linked the checkout in as the tap, they are the
          # same file and macOS `cp` refuses (exit 1) to copy it onto itself.
          tap_cask="$(brew --repo digitaltolk/tools)/Casks/lord-of-the-rows.rb"
          [ Casks/lord-of-the-rows.rb -ef "$tap_cask" ] || cp "$tap_cask" Casks/lord-of-the-rows.rb

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-lord-of-the-rows-cask
          commit-message: "Update lord-of-the-rows cask"
          title: "Update lord-of-the-rows cask"
          body: "Automated update from the latest DigitalTolk/Lord-of-the-Rows release."
          labels: dependencies, automated
          delete-branch: true
