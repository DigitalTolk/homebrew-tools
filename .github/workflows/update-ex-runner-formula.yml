name: Update ex-runner formula

on:
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [ex-runner-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Update formula from latest ex-runners release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby scripts/update-ex-runner-formula.rb

      - name: Show formula update diff
        run: |
          git status --short
          git diff -- Formula/ex-runner.rb

      - name: Prepare local tap
        run: scripts/prepare-homebrew-tap.sh

      - name: Lint updated formula
        run: |
          brew style digitaltolk/tools/ex-runner
          # `version` is declared explicitly because the release assets are arch-specific;
          # skip the redundant-version check Homebrew reports since it learned to scan
          # GitHub release tags for a version.
          brew audit --formula --strict --online --except=version digitaltolk/tools/ex-runner

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-ex-runner-formula
          commit-message: "Update ex-runner formula"
          title: "Update ex-runner formula"
          body: "Automated update from the latest DigitalTolk/ex-runners release."
          labels: dependencies, automated
          add-paths: Formula/ex-runner.rb
          delete-branch: true
