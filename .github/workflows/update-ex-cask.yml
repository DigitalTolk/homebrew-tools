name: Update ex cask

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Update cask from latest ex-electron release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ruby scripts/update-ex-cask.rb

      - name: Prepare local tap
        run: scripts/prepare-homebrew-tap.sh

      - name: Lint updated cask
        run: |
          brew style digitaltolk/tools/ex
          # The app's LSMinimumSystemVersion moves with the Electron it bundles;
          # --fix sets `depends_on macos:` to match it instead of failing.
          brew audit --cask --strict --online --fix digitaltolk/tools/ex
          # The fix lands in the tap's copy, so bring it back for the PR.
          cp "$(brew --repo digitaltolk/tools)/Casks/ex.rb" Casks/ex.rb

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-ex-cask
          commit-message: "Update ex cask"
          title: "Update ex cask"
          body: "Automated update from the latest DigitalTolk/ex-electron release."
          labels: dependencies, automated
          delete-branch: true
